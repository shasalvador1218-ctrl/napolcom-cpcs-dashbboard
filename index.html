<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal AI Assistant</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      background-color: #f9fafb;
      color: #111827;
    }
    h1 { margin-bottom: 4px; }
    p { margin-top: 0; color: #4b5563; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 16px;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }
    textarea, input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      background-color: #ffffff;
    }
    button {
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      font-weight: 500;
      font-size: 14px;
      margin-top: 4px;
      margin-right: 8px;
    }
    #submitBtn { background-color: #2563eb; color: white; }
    #submitBtn:hover { background-color: #1d4ed8; }
    #clearBtn { background-color: #e5e7eb; color: #374151; }
    #saveBtn { background-color: #059669; color: white; }
  </style>
</head>
<body>
  <h1>🤖 Personal AI Assistant</h1>
  <p>Enter a free API key, type your prompt, click <strong>Submit</strong> to generate, and click <strong>Save as File</strong> to download.</p>

  <label><strong>Provider:</strong>
    <select id="providerSelect">
      <option value="openrouter" selected>OpenRouter (Free models)</option>
      <option value="gemini">Google Gemini (Free tier)</option>
    </select>
  </label>

  <label><strong>API Key:</strong>
    <input id="apiKeyInput" type="password" placeholder="Paste your free OpenRouter or Gemini API key..." />
  </label>

  <div class="grid">
    <div>
      <label><strong>Your Prompt:</strong>
        <textarea id="promptInput" rows="7" placeholder="Ask anything..."></textarea>
      </label>
      <button id="submitBtn">Submit</button>
      <button id="clearBtn" type="button">🗑️ Clear Query</button>
    </div>

    <div>
      <label><strong>AI Response:</strong>
        <textarea id="responseOutput" rows="7" readonly placeholder="Response will appear here..."></textarea>
      </label>
      <button id="saveBtn" type="button">💾 Save as File</button>
    </div>
  </div>

  <script>
    const submitBtn = document.getElementById("submitBtn");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const providerSelect = document.getElementById("providerSelect");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const promptInput = document.getElementById("promptInput");
    const responseOutput = document.getElementById("responseOutput");

    async function callOpenRouter(apiKey, prompt) {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "openrouter/free",
          messages: [{ role: "user", content: prompt }]
        })
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || `HTTP ${res.status}`);
      }
      return data.choices?.[0]?.message?.content?.trim() || "Empty response.";
    }

    async function callGemini(apiKey, prompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || `HTTP ${res.status}`);
      }
      const parts = data.candidates?.[0]?.content?.parts || [];
      return parts.map(p => p.text || "").join("").trim() || "Empty response.";
    }

    submitBtn.addEventListener("click", async () => {
      const prompt = promptInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      const provider = providerSelect.value;

      if (!apiKey) {
        responseOutput.value = "Please paste a free API key first.";
        return;
      }
      if (!prompt) {
        responseOutput.value = "Please enter a prompt first.";
        return;
      }

      submitBtn.disabled = true;
      responseOutput.value = "Thinking...";

      try {
        const reply = provider === "gemini"
          ? await callGemini(apiKey, prompt)
          : await callOpenRouter(apiKey, prompt);
        responseOutput.value = reply;
      } catch (err) {
        responseOutput.value = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    clearBtn.addEventListener("click", () => {
      promptInput.value = "";
      responseOutput.value = "";
    });

    saveBtn.addEventListener("click", () => {
      const text = responseOutput.value;
      if (!text || text === "Thinking..." || text.startsWith("Error:")) return;
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ai_response_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
